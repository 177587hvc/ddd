<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>后台管理 - 班级宠物园</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { background:#0f172a; color:#e2e8f0; font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif; }
  .row:hover { background:#1e293b; }
  input,select { background:#334155; border:1px solid #475569; border-radius:6px; padding:4px 8px; color:#fff; font-size:13px; }
  input:focus,select:focus { outline:none; border-color:#8b5cf6; }
  .tab.active { background:#8b5cf6; }
</style>
</head>
<body class="p-4 md:p-8 max-w-6xl mx-auto">
<h1 class="text-2xl font-bold mb-1">🐾 班级宠物园 · 后台</h1>
<p class="text-slate-400 text-sm mb-6">管理老师班级数据与宠物列表</p>

<div id="loginBox" class="bg-slate-800 p-6 rounded-2xl max-w-sm mx-auto mt-12">
  <label class="text-sm text-slate-400">管理员密码</label>
  <input id="pw" type="password" placeholder="admin2024"
    class="w-full mt-2 px-3 py-2 rounded-lg bg-slate-700 text-white outline-none focus:ring-2 focus:ring-violet-500">
  <button onclick="login()" class="w-full mt-4 bg-violet-600 hover:bg-violet-500 py-2 rounded-lg font-bold">登录</button>
  <div id="err" class="text-red-400 text-sm mt-2"></div>
</div>

<div id="main" class="hidden">
  <div class="flex gap-2 mb-4">
    <button class="tab active px-4 py-2 rounded-lg bg-slate-700" onclick="showTab('teachers',this)">👩‍🏫 老师数据</button>
    <button class="tab px-4 py-2 rounded-lg bg-slate-700" onclick="showTab('pets',this)">🐾 宠物列表</button>
  </div>

  <!-- 老师数据 -->
  <div id="tab-teachers">
    <div class="grid grid-cols-3 gap-3 mb-6">
      <div class="bg-slate-800 p-4 rounded-xl"><div class="text-slate-400 text-xs">老师数</div><div id="tTeachers" class="text-3xl font-bold mt-1">0</div></div>
      <div class="bg-slate-800 p-4 rounded-xl"><div class="text-slate-400 text-xs">学生总数</div><div id="tStudents" class="text-3xl font-bold mt-1">0</div></div>
      <div class="bg-slate-800 p-4 rounded-xl"><div class="text-slate-400 text-xs">最近活跃</div><div id="tActive" class="text-sm mt-2 text-slate-300">-</div></div>
    </div>
    <div class="bg-slate-800 rounded-xl overflow-hidden mb-6">
      <table class="w-full text-sm">
        <thead><tr class="bg-slate-700 text-left">
          <th class="p-3">用户名</th><th class="p-3">姓名</th><th class="p-3">学生数</th><th class="p-3">更新时间</th><th class="p-3"></th>
        </tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
    <div id="editor" class="hidden bg-slate-800 rounded-xl p-4">
      <div class="flex justify-between items-center mb-3">
        <h2 id="editorTitle" class="text-lg font-bold"></h2>
        <button onclick="closeEditor()" class="text-slate-400 hover:text-white">关闭 ✕</button>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-sm">
          <thead><tr class="text-left text-slate-400">
            <th class="p-2">姓名</th><th class="p-2">宠物 type</th>
            <th class="p-2">fedLegs</th><th class="p-2">chickenLegs</th><th class="p-2">累计</th><th class="p-2"></th>
          </tr></thead>
          <tbody id="editorBody"></tbody>
        </table>
      </div>
      <div class="mt-4 flex gap-3">
        <button onclick="saveTeacher()" class="bg-violet-600 hover:bg-violet-500 px-4 py-2 rounded-lg font-bold">保存修改</button>
        <span id="saveMsg" class="text-sm self-center"></span>
      </div>
    </div>
  </div>

  <!-- 宠物列表 -->
  <div id="tab-pets" class="hidden">
    <div class="flex justify-between items-center mb-3">
      <div class="text-sm text-slate-400">共 <span id="petCount">0</span> 种宠物。改完点"保存宠物列表"。</div>
      <div class="flex gap-2">
        <button onclick="addPetRow()" class="bg-slate-700 hover:bg-slate-600 px-3 py-1.5 rounded">+ 新增</button>
        <button onclick="savePets()" class="bg-violet-600 hover:bg-violet-500 px-4 py-1.5 rounded font-bold">保存宠物列表</button>
      </div>
    </div>
    <div id="petsMsg" class="text-sm mb-2"></div>
    <div class="bg-slate-800 rounded-xl overflow-hidden">
      <table class="w-full text-sm">
        <thead><tr class="bg-slate-700 text-left">
          <th class="p-2">type（英文id）</th><th class="p-2">显示名</th><th class="p-2">emoji</th><th class="p-2">图片文件夹(留空=type)</th><th class="p-2"></th>
        </tr></thead>
        <tbody id="petsBody"></tbody>
      </table>
    </div>
  </div>
</div>

  for (const k of ['students', 'children', 'petStudents', 'pets', 'classStudents']) {
    if (Array.isArray(raw[k])) return raw[k];
  }
  return [];
}

let petList = [];

function showTab(name, btn) {
  document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('tab-teachers').classList.toggle('hidden', name !== 'teachers');
  document.getElementById('tab-pets').classList.toggle('hidden', name !== 'pets');
}

async function login() {
  PW = document.getElementById('pw').value;
  document.getElementById('err').textContent = '';
  try {
    const r = await fetch('/backend/api.php?action=adminDump', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: PW })
    });
    const j = await r.json();
    if (!j.ok) { document.getElementById('err').textContent = j.msg || '登录失败'; return; }
    document.getElementById('loginBox').classList.add('hidden');
    document.getElementById('main').classList.remove('hidden');
    renderTeachers(j.teachers);
    loadPets();
  } catch (e) { document.getElementById('err').textContent = '网络错误: ' + e.message; }
}

function renderTeachers(ts) {
  document.getElementById('tTeachers').textContent = ts.length;
  let total = 0, last = 0;
  const tb = document.getElementById('tbody'); tb.innerHTML = '';
  ts.forEach(t => {
    const st = pickStudents(t.raw);
    total += st.length;
    const up = new Date(t.updatedAt || 0); if (up > last) last = up;
    const tr = document.createElement('tr');
    tr.className = 'row border-t border-slate-700';
    tr.innerHTML =
      '<td class="p-3">' + t.username + '</td>' +
      '<td class="p-3">' + (t.name || '') + '</td>' +
      '<td class="p-3">' + st.length + '</td>' +
      '<td class="p-3 text-slate-400">' + (t.updatedAt || '').slice(0, 16).replace('T', ' ') + '</td>' +
      '<td class="p-3 text-right"><button class="text-violet-400 hover:underline" onclick="openEditor(\'' + t.username + '\')">编辑学生</button></td>';
    tb.appendChild(tr);
    window['d_' + t.username] = t;
  });
  document.getElementById('tStudents').textContent = total;
  document.getElementById('tActive').textContent = last ? last.toLocaleString('zh-CN') : '-';
}

function openEditor(un) {
  const t = window['d_' + un];
  document.getElementById('editorTitle').textContent = '编辑：' + un + '（' + (t.name || '') + '）';
  const students = pickStudents(t.raw);
  const eb = document.getElementById('editorBody'); eb.innerHTML = '';
  students.forEach((s, i) => {
    const tr = document.createElement('tr');
    tr.className = 'border-t border-slate-700';
    tr.innerHTML =
      '<td class="p-2"><input data-i="' + i + '" data-k="name" value="' + (s.name || '').replace(/"/g, '&quot;') + '"></td>' +
      '<td class="p-2"><input data-i="' + i + '" data-k="petType" value="' + (s.petType || '') + '" placeholder="留空=无宠" style="width:130px"></td>' +
      '<td class="p-2"><input data-i="' + i + '" data-k="fedLegs" type="number" value="' + (s.fedLegs || 0) + '" style="width:80px"></td>' +
      '<td class="p-2"><input data-i="' + i + '" data-k="chickenLegs" type="number" value="' + (s.chickenLegs || 0) + '" style="width:80px"></td>' +
      '<td class="p-2"><input data-i="' + i + '" data-k="cumulativeFedLegs" type="number" value="' + (s.cumulativeFedLegs || 0) + '" style="width:90px"></td>' +
      '<td class="p-2 text-right"><button class="text-red-400 hover:underline" onclick="delRow(this)">删除</button></td>';
    eb.appendChild(tr);
  });
  window.editingUser = un;
  document.getElementById('editor').classList.remove('hidden');
  document.getElementById('saveMsg').textContent = '';
  document.getElementById('editor').scrollIntoView({ behavior: 'smooth' });
}
function delRow(btn) { btn.closest('tr').remove(); }
function closeEditor() { document.getElementById('editor').classList.add('hidden'); window.editingUser = null; }

async function saveTeacher() {
  if (!window.editingUser) return;
  const t = window['d_' + window.editingUser];
  const raw = t.raw;
  const key = ['students', 'children', 'petStudents', 'pets', 'classStudents'].find(k => Array.isArray(raw[k]));
  const rows = document.querySelectorAll('#editorBody tr');
  const students = [];
  rows.forEach(tr => {
    const ins = tr.querySelectorAll('input');
    const o = {};
    ins.forEach(inp => {
      const k = inp.dataset.k;
      if (k === 'name') o[k] = inp.value;
      else if (k === 'petType') o[k] = inp.value || null;
      else o[k] = Number(inp.value) || 0;
    });
    const i = Number(ins[0].dataset.i);
    if (raw[key][i] && raw[key][i].id) o.id = raw[key][i].id;
    students.push(o);
  });
  raw[key] = students;
  try {
    const r = await fetch('/backend/api.php?action=adminSaveTeacher', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: PW, username: window.editingUser, data: raw })
    });
    const j = await r.json();
    document.getElementById('saveMsg').textContent = j.ok ? '✓ 已保存 ' + new Date().toLocaleTimeString() : '✗ ' + (j.msg || '失败');
    if (j.ok) t.raw = raw;
  } catch (e) { document.getElementById('saveMsg').textContent = '✗ 网络错误'; }
}

async function loadPets() {
  try {
    const r = await fetch('/backend/api.php?action=adminListPets', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: PW })
    });
    const j = await r.json();
    petList = (j.ok && Array.isArray(j.pets) && j.pets.length) ? j.pets : DEFAULT_PETS.slice();
    renderPets();
  } catch (e) { petList = DEFAULT_PETS.slice(); renderPets(); }
}

function renderPets() {
  const pb = document.getElementById('petsBody'); pb.innerHTML = '';
  document.getElementById('petCount').textContent = petList.length;
  petList.forEach((p, i) => {
    const tr = document.createElement('tr');
    tr.className = 'border-t border-slate-700';
    tr.innerHTML =
      '<td class="p-2"><input data-i="' + i + '" data-k="type" value="' + (p.type || '') + '" style="width:140px"></td>' +
      '<td class="p-2"><input data-i="' + i + '" data-k="name" value="' + (p.name || '') + '"></td>' +
      '<td class="p-2"><input data-i="' + i + '" data-k="emoji" value="' + (p.emoji || '') + '" style="width:60px"></td>' +
      '<td class="p-2"><input data-i="' + i + '" data-k="folder" value="' + (p.folder || '') + '" placeholder="留空=type" style="width:160px"></td>' +
      '<td class="p-2 text-right"><button class="text-red-400 hover:underline" onclick="delRow(this)">删</button></td>';
    pb.appendChild(tr);
  });
}

function addPetRow() {
  petList.push({ type: '', name: '', emoji: '🐾', folder: '' });
  renderPets();
}

async function savePets() {
  const rows = document.querySelectorAll('#petsBody tr');
  const list = [];
  rows.forEach(tr => {
    const ins = tr.querySelectorAll('input');
    const o = {};
    ins.forEach(inp => { o[inp.dataset.k] = inp.value; });
    if (o.type) list.push({ type: o.type, name: o.name || o.type, emoji: o.emoji || '🐾', folder: o.folder || undefined });
  });
  petList = list;
  try {
    const r = await fetch('/backend/api.php?action=adminSavePets', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: PW, pets: list })
    });
    const j = await r.json();
    document.getElementById('petsMsg').textContent = j.ok ? '✓ 已保存 ' + list.length + ' 种，主站刷新生效' : '✗ ' + (j.msg || '失败');
    renderPets();
  } catch (e) { document.getElementById('petsMsg').textContent = '✗ 网络错误'; }
}

document.getElementById('pw').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
</script>
</body>
