<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>晨读刮刮乐 - 终极舞台版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 全局字体与基础防选中 */
        body { margin: 0; overflow: hidden; background-color: #020617; color: #f8fafc; user-select: none; font-family: 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif; }
        
        /* 炫酷的深空霓虹动态背景 */
        .bg-gradient-custom {
            background: linear-gradient(-45deg, #020617, #1e1b4b, #0f172a, #312e81);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
        }
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* 舞台光效点缀 */
        .stage-lights { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; overflow: hidden; z-index: 1; }
        .light-beam { position: absolute; top: -50%; width: 150px; height: 200%; background: linear-gradient(to bottom, rgba(56, 189, 248, 0.2) 0%, transparent 100%); transform-origin: top center; filter: blur(30px); }
        .light-beam:nth-child(1) { left: 20%; transform: rotate(15deg); animation: sway 8s infinite alternate ease-in-out; }
        .light-beam:nth-child(2) { right: 20%; background: linear-gradient(to bottom, rgba(167, 139, 250, 0.2) 0%, transparent 100%); transform: rotate(-15deg); animation: sway 10s infinite alternate-reverse ease-in-out; }
        @keyframes sway { 0% { transform: rotate(10deg); } 100% { transform: rotate(25deg); } }

        /* 画布阴影 */
        #mainCanvas { filter: drop-shadow(0 0 50px rgba(56, 189, 248, 0.3)); }
        
        /* 炫酷滑块 */
        input[type=range] { -webkit-appearance: none; background: transparent; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 24px; width: 24px; border-radius: 50%; background: #0ea5e9; cursor: pointer; margin-top: -8px; box-shadow: 0 0 15px #0ea5e9, inset 0 0 5px white; border: 2px solid #fff; }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 8px; cursor: pointer; background: #334155; border-radius: 4px; box-shadow: inset 0 2px 4px rgba(0,0,0,0.5); }
        input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        
        /* 赛博玻璃面板 */
        .glass-panel { background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); }

        /* 动画 */
        .fade-in { animation: fadeIn 0.6s cubic-bezier(0.4, 0, 0.2, 1) forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        .bounce-soft { animation: bounceSoft 3s infinite ease-in-out; }
        @keyframes bounceSoft { 0%, 100% { transform: translateY(-3%); } 50% { transform: translateY(3%); } }
        .pulse-glow { animation: pulseGlow 2s infinite alternate; }
        @keyframes pulseGlow { from { text-shadow: 0 0 10px rgba(56, 189, 248, 0.5); } to { text-shadow: 0 0 30px rgba(56, 189, 248, 1), 0 0 10px #fff; } }
        
        /* 滚动条 */
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.3); border-radius: 10px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #475569; border-radius: 10px; }
        .custom-scroll::-webkit-scrollbar-thumb:hover { background: #64748b; }
    </style>
</head>
<body class="w-screen h-screen bg-gradient-custom relative">

    <!-- 动态粒子星空层 (最底层) -->
    <canvas id="bgParticleCanvas" class="absolute inset-0 z-0 pointer-events-none"></canvas>
    <!-- 舞台光效装饰 -->
    <div class="stage-lights">
        <div class="light-beam"></div>
        <div class="light-beam"></div>
    </div>

    <!-- MAIN CANVAS (主游戏画面，绝对居中) -->
    <div class="absolute inset-0 flex items-center justify-center pointer-events-none z-10">
        <canvas id="mainCanvas" class="w-full h-full object-contain"></canvas>
    </div>

    <!-- EMPTY STATE PROMPT -->
    <div id="emptyState" class="absolute inset-0 flex flex-col items-center justify-center z-20 pointer-events-none fade-in">
        <div onclick="toggleSettings(true)" class="w-32 h-32 mb-8 text-cyan-400 bounce-soft opacity-90 flex justify-center items-center bg-slate-900/50 rounded-full shadow-[0_0_40px_rgba(34,211,238,0.2)] border border-cyan-500/30 cursor-pointer hover:bg-slate-800/70 hover:scale-110 transition-all pointer-events-auto">
            <svg id="emptyStateIcon" class="w-16 h-16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
        </div>
        <h1 id="emptyStateText" class="text-3xl md:text-4xl font-bold tracking-widest text-slate-300 drop-shadow-lg text-center">请点击上方按钮设置刮开的奖励内容以及权重</h1>
    </div>

    <!-- DRAW TICKET OVERLAY (刮刮乐抽取界面) -->
    <div id="drawOverlay" class="hidden absolute inset-0 z-40 flex-col items-center justify-center bg-black/70 backdrop-blur-md fade-in">
        <h2 class="text-5xl md:text-7xl font-black text-transparent bg-clip-text bg-gradient-to-b from-yellow-200 to-amber-500 mb-16 drop-shadow-[0_0_20px_rgba(245,158,11,0.5)] bounce-soft text-center w-full">
            🔥 大声朗读 刮开你们想要的奖励吧！ 🔥
        </h2>
        <button onclick="executeDraw()" class="group relative px-16 py-8 bg-gradient-to-b from-amber-400 to-orange-600 rounded-[3rem] shadow-[0_0_50px_rgba(245,158,11,0.6)] hover:shadow-[0_0_80px_rgba(245,158,11,0.8)] transition-all transform hover:scale-105 cursor-pointer border-4 border-yellow-200">
            <div class="absolute inset-0 rounded-[3rem] bg-gradient-to-b from-white/20 to-transparent opacity-0 group-hover:opacity-100 transition-opacity"></div>
            <span class="relative z-10 text-5xl font-black text-white tracking-widest drop-shadow-md">👉 点击开始朗读刮刮乐 👈</span>
        </button>
    </div>

    <!-- TOP HUD (Progress) -->
    <div id="topHud" class="hidden absolute top-8 left-0 right-0 w-full flex-col items-center justify-start gap-5 z-30 fade-in pointer-events-none">
        <h1 class="text-3xl md:text-5xl font-black tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-blue-400 to-purple-500 pulse-glow text-center w-full">
            老师温馨提示：朗读声越大刮的就越快呦！
        </h1>
        <div class="w-3/4 max-w-4xl h-10 bg-slate-900/80 backdrop-blur-md rounded-full border-2 border-slate-600 shadow-[0_0_30px_rgba(0,0,0,0.8)] overflow-hidden relative">
            <div id="progressBar" class="h-full bg-gradient-to-r from-green-500 via-emerald-400 to-cyan-400 transition-none flex items-center justify-end pr-4 w-0 shadow-[0_0_20px_rgba(52,211,116,0.6)] relative">
                <span id="progressText" class="text-white font-black text-lg hidden drop-shadow-[0_2px_2px_rgba(0,0,0,0.8)]">0%</span>
            </div>
            <div class="absolute top-0 bottom-0 w-1 bg-yellow-400 left-[70%] -translate-x-1/2 shadow-[0_0_10px_yellow] z-10"></div>
        </div>
    </div>

    <!-- SIDE HUD (Volume) -->
    <div id="sideHud" class="hidden absolute left-8 top-1/2 -translate-y-1/2 h-2/3 w-20 glass-panel rounded-full p-3 flex-col-reverse items-center z-30 fade-in">
        <div class="w-full bg-slate-950 rounded-full h-full relative overflow-hidden flex flex-col-reverse shadow-inner border border-slate-700">
            <div id="volumeBar" class="w-full transition-all duration-75 ease-out rounded-full bg-rose-500 h-0"></div>
            <div id="thresholdLine" class="absolute w-full h-1 bg-yellow-400 z-10 shadow-[0_0_10px_yellow] bottom-[60%]"></div>
        </div>
        <div class="mt-5 mb-3 text-center flex flex-col items-center">
            <div id="volumeIconBg" class="p-2 bg-rose-500/20 rounded-full mb-2 transition-colors border border-rose-500/50">
                <svg id="volumeIcon" class="w-6 h-6 text-rose-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path></svg>
            </div>
            <span id="volumeText" class="text-sm font-black text-slate-300">0dB</span>
        </div>
    </div>

    <!-- SUCCESS OVERLAY (结算界面，半透明不挡后面纸条) -->
    <div id="successOverlay" class="hidden absolute inset-0 z-50 flex flex-col items-center justify-center bg-black/40 backdrop-blur-sm fade-in px-4 overflow-y-auto">
        <div class="transform scale-90 flex flex-col items-center">
        <div class="relative bounce-soft mb-4 sm:mb-8">
            <div class="absolute inset-0 bg-yellow-400 blur-[60px] opacity-60 rounded-full"></div>
            <svg class="relative w-32 h-32 sm:w-40 sm:h-40 md:w-56 md:h-56 text-yellow-400 drop-shadow-[0_0_20px_rgba(250,204,21,0.8)]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z"></path></svg>
        </div>
        <h2 class="text-3xl sm:text-4xl md:text-6xl lg:text-8xl font-black text-transparent bg-clip-text bg-gradient-to-b from-yellow-200 to-yellow-600 mb-6 sm:mb-8 md:mb-10 drop-shadow-[0_10px_10px_rgba(0,0,0,0.8)] text-center w-full px-4">🎉 解锁大成功 🎉</h2>
        
        <div class="px-6 sm:px-10 md:px-16 py-4 sm:py-6 md:py-8 glass-panel border-4 border-yellow-500/50 rounded-2xl sm:rounded-3xl md:rounded-[3rem] flex flex-col items-center transform hover:scale-105 transition-transform shadow-[0_0_50px_rgba(234,179,8,0.2)] max-w-[90vw]">
            <span id="finalRewardLabel" class="text-yellow-400 text-lg sm:text-2xl md:text-3xl font-bold mb-2 sm:mb-3 md:mb-4 hidden bg-yellow-400/10 px-4 sm:px-6 py-1 sm:py-2 rounded-full border border-yellow-400/30">最终奖励</span>
            <h3 id="finalRewardText" class="text-3xl sm:text-4xl md:text-6xl lg:text-8xl font-black tracking-widest text-white text-center drop-shadow-[0_5px_5px_rgba(0,0,0,1)] break-words max-w-full">全班免作业</h3>
        </div>

        <button onclick="resetGame()" class="mt-8 sm:mt-12 md:mt-16 px-8 sm:px-10 md:px-12 py-3 sm:py-4 md:py-5 bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white rounded-full transition-all shadow-[0_0_30px_rgba(6,182,212,0.5)] hover:shadow-[0_0_50px_rgba(6,182,212,0.8)] hover:-translate-y-1 font-black text-xl sm:text-2xl md:text-3xl cursor-pointer border-2 border-cyan-300 pointer-events-auto">重新开始下一局</button>
        </div>
    </div>

    <!-- TINY OPEN SETTINGS BUTTON -->
    <button id="openSettingsBtn" onclick="toggleSettings(true)" class="absolute top-6 left-6 z-40 p-3 glass-panel rounded-2xl shadow-xl hover:bg-slate-800 hover:shadow-2xl hover:-translate-y-1 transition-all group cursor-pointer text-slate-400 hover:text-cyan-400">
        <svg class="w-8 h-8 group-hover:rotate-90 transition-transform duration-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
    </button>

    <!-- FULLSCREEN BUTTON -->
    <button id="fullscreenBtn" onclick="toggleFullscreen()" class="absolute top-6 right-6 z-40 p-3 glass-panel rounded-2xl shadow-xl hover:bg-slate-800 hover:shadow-2xl hover:-translate-y-1 transition-all group cursor-pointer text-slate-400 hover:text-cyan-400">
        <svg id="fullscreenIcon" class="w-8 h-8 transition-transform duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <!-- 进入全屏图标 -->
            <path id="enterFullscreenPath" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"></path>
            <!-- 退出全屏图标（默认隐藏） -->
            <path id="exitFullscreenPath" class="hidden" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 9V4.5M9 9H4.5M9 9L3.75 3.75M15 9h4.5M15 9V4.5M15 9l5.25-5.25M9 15v4.5M9 15H4.5M9 15l-5.25 5.25M15 15h4.5M15 15v4.5m0-4.5l5.25 5.25"></path>
        </svg>
    </button>

    <!-- TEACHER SETTINGS MODAL -->
    <div id="settingsModal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm fade-in">
        <div class="glass-panel w-[98vw] max-w-[1200px] sm:w-[95vw] md:w-[90vw] lg:w-[85vw] xl:max-w-[1400px] p-6 sm:p-8 md:p-10 rounded-[2rem] flex flex-col max-h-[95vh] relative shadow-2xl">
            <button onclick="toggleSettings(false)" class="absolute top-6 right-6 text-slate-400 hover:text-rose-400 hover:bg-rose-500/20 p-2 rounded-full transition-colors cursor-pointer">
                <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>

            <div class="flex items-center gap-3 mb-6 shrink-0 justify-center">
                <div class="p-2 bg-cyan-500/20 rounded-xl text-cyan-400 border border-cyan-500/30">
                    <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"></path></svg>
                </div>
                <h3 class="text-3xl font-black text-white tracking-wider">控制中心</h3>
            </div>

            <div class="overflow-y-auto custom-scroll pr-3 shrink space-y-5">
                <!-- 0. 模式切换 -->
                <div class="bg-slate-900/50 p-2 rounded-2xl border border-slate-700 flex gap-2">
                    <button id="modeBtnImage" onclick="switchMode('image')" class="flex-1 py-3 rounded-xl font-bold text-base transition-all bg-transparent text-slate-400 hover:bg-slate-800 hover:text-white">刮图片模式</button>
                    <button id="modeBtnTicket" onclick="switchMode('ticket')" class="flex-1 py-3 rounded-xl font-black text-base transition-all bg-purple-500 text-white shadow-[0_0_15px_rgba(168,85,247,0.5)]">刮刮乐模式</button>
                </div>

                <!-- 使用网格布局优化空间利用 -->
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-5">
                    <!-- 左列：奖励设置 -->
                    <div class="space-y-5">
                        <!-- 1. 刮图片设置区 -->
                        <div id="setupImage" class="hidden bg-slate-800/50 p-5 rounded-2xl border border-slate-700">
                            <label class="block text-sm font-black text-slate-300 mb-3 text-center">🎨 导入素材 (透明PNG)</label>
                            <label class="flex flex-col items-center justify-center w-full h-28 border-2 border-dashed border-cyan-500/50 bg-cyan-950/30 rounded-xl cursor-pointer hover:bg-cyan-900/40 transition-colors group">
                                <svg class="w-10 h-10 text-cyan-400 group-hover:scale-110 transition-transform mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                                <span id="uploadBtnText" class="text-sm font-bold text-cyan-300">点击选择图片文件</span>
                                <input type="file" accept="image/png" class="hidden" onchange="handleImageUpload(event)" />
                            </label>
                        </div>

                        <!-- 1. 刮刮乐设置区 -->
                        <div id="setupTicket" class="block bg-slate-800/50 p-5 rounded-2xl border border-slate-700">
                            <div class="flex justify-between items-center mb-4">
                                <label class="block text-sm font-black text-slate-300">🎁 奖池与概率分布</label>
                                <button onclick="addReward()" class="text-xs bg-cyan-500/20 hover:bg-cyan-500/40 px-3 py-1.5 rounded-lg text-cyan-300 font-bold transition-colors border border-cyan-500/30">+ 新增奖励</button>
                            </div>
                            <div class="flex gap-2 text-[12px] font-bold text-slate-400 mb-2 px-1">
                                <span class="flex-1">奖励内容</span>
                                <span class="w-16 text-center">权重</span>
                                <span class="w-9"></span>
                            </div>
                            <div id="rewardListContainer" class="space-y-2"></div>
                        </div>
                    </div>

                    <!-- 右列：音量和时长设置 -->
                    <div class="space-y-5">
                        <!-- 2. Threshold -->
                        <div class="bg-slate-800/50 p-5 rounded-2xl border border-slate-700">
                            <div class="flex justify-between text-sm font-black text-slate-300 mb-4">
                                <label>🎤 达标音量阈值</label>
                                <span id="thresholdValText" class="text-cyan-400 bg-cyan-950 px-3 py-1 rounded-md border border-cyan-800">60 dB</span>
                            </div>
                            <input type="range" id="thresholdSlider" min="30" max="100" value="60" oninput="updateThreshold(this.value)" class="w-full">
                        </div>

                        <!-- 3. Duration Setup -->
                        <div class="bg-slate-800/50 p-5 rounded-2xl border border-slate-700">
                            <label class="block text-sm font-black text-slate-300 mb-4 text-center">⏳ 刮开所需朗读时长</label>
                            <div class="flex items-center gap-4 justify-center">
                                <div class="relative w-24">
                                    <input type="number" id="durationMin" min="0" max="30" value="1" class="w-full bg-slate-900 border border-slate-600 rounded-xl px-3 py-3 text-center focus:border-cyan-400 outline-none font-black text-white transition-all text-xl" onchange="validateDuration()">
                                    <span class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-500 text-sm font-bold">分</span>
                                </div>
                                <span class="text-slate-400 font-black text-2xl">:</span>
                                <div class="relative w-24">
                                    <input type="number" id="durationSec" min="0" max="59" value="0" class="w-full bg-slate-900 border border-slate-600 rounded-xl px-3 py-3 text-center focus:border-cyan-400 outline-none font-black text-white transition-all text-xl" onchange="validateDuration()">
                                    <span class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-500 text-sm font-bold">秒</span>
                                </div>
                            </div>
                            <p id="durationWarning" class="text-xs text-rose-400 mt-3 hidden text-center font-bold bg-rose-950/50 py-2 rounded-md border border-rose-900">时长需在20秒至30分钟之间！</p>
                        </div>
                    </div>
                </div>
            </div>
            <!-- Start Button -->
            <div class="mt-6 shrink-0">
                <button id="mainBtn" onclick="toggleGame()" class="w-full py-4 rounded-2xl font-black text-2xl flex items-center justify-center gap-3 transition-all shadow-[0_0_20px_rgba(6,182,212,0.4)] bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white cursor-pointer transform hover:-translate-y-1 border border-cyan-400/50">
                    <span id="btnIconContainer">
                        <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132A1 1 0 0014.752 11.168z"></path></svg>
                    </span>
                    <span id="btnText">开始晨读刮刮乐</span>
                </button>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // 动态粒子星空背景特效
        // ==========================================
        const bgCanvas = document.getElementById('bgParticleCanvas');
        const bgCtx = bgCanvas.getContext('2d');
        let particles = [];
        
        function initParticles() {
            bgCanvas.width = window.innerWidth;
            bgCanvas.height = window.innerHeight;
            particles = [];
            for(let i = 0; i < 60; i++) {
                particles.push({
                    x: Math.random() * bgCanvas.width,
                    y: Math.random() * bgCanvas.height,
                    radius: Math.random() * 3 + 1,
                    vx: (Math.random() - 0.5) * 0.5,
                    vy: Math.random() * -1.5 - 0.5,
                    alpha: Math.random() * 0.5 + 0.2,
                    color: Math.random() > 0.5 ? '#38bdf8' : '#818cf8' // Cyan & Indigo
                });
            }
        }
        
        function drawParticles() {
            bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);
            particles.forEach(p => {
                p.x += p.vx;
                p.y += p.vy;
                if(p.y < -10) { p.y = bgCanvas.height + 10; p.x = Math.random() * bgCanvas.width; }
                
                bgCtx.beginPath();
                bgCtx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                bgCtx.fillStyle = p.color;
                bgCtx.globalAlpha = p.alpha;
                bgCtx.shadowBlur = 15;
                bgCtx.shadowColor = p.color;
                bgCtx.fill();
            });
            bgCtx.globalAlpha = 1.0;
            bgCtx.shadowBlur = 0;
            requestAnimationFrame(drawParticles);
        }
        window.addEventListener('resize', initParticles);
        initParticles();
        drawParticles();

        // ==========================================
        // 游戏核心逻辑

        let gameMode = 'ticket';

        let finalRewardTextStr = "全班免作业";

        // 从 localStorage 加载奖励数据，如果没有则使用默认值

        function loadRewards() {

                { id: 3, text: '全班免作业一天', weight: 15 },
                { id: 4, text: '老师买零食', weight: 5 },
                { id: 5, text: '自由活动一节课', weight: 30 }

        }

        // 保存奖励到 localStorage
        function saveRewards() {
            try {
                localStorage.setItem('scratchRewards', JSON.stringify(rewards));
                console.log('[存储] 奖励设置已自动保存');
            } catch (e) {
                console.error('[存储] 保存奖励设置失败', e);
            }
        }

        // 页面加载时初始化奖励数据
        loadRewards();

        let audioContext = null;
        let analyser = null;
        let mediaStream = null;
        let animationFrameId = null;

        const canvas = document.getElementById('mainCanvas');
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            if (activeCanvasSource) renderCanvas(progress);
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();
        renderRewardList();
        
        // 恢复已保存的设置到 UI
        function restoreSettings() {
            // 恢复音量阈值
            document.getElementById('thresholdSlider').value = threshold;
            document.getElementById('thresholdValText').innerText = threshold + ' dB';
            document.getElementById('thresholdLine').style.bottom = threshold + '%';

        restoreSettings();

        function switchMode(mode) {

        function updateEmptyState() {

        function handleImageUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    uploadedImage = img;
                    if (gameMode === 'image') {
                        activeCanvasSource = img;
                        ticketBgCache = null;

        function renderRewardList() {
            const container = document.getElementById('rewardListContainer');

        function updateReward(index, key, value) {
            if (key === 'weight') rewards[index][key] = parseInt(value) || 0;

            saveRewards(); // 自动保存
        }

        function removeReward(index) {
            if (rewards.length <= 1) return alert("最少需要保留一个奖励项！");
            rewards.splice(index, 1);

        }

        function addReward() {
            rewards.push({ id: Date.now(), text: '新奖励', weight: 10 });
            renderRewardList();
            saveRewards(); // 自动保存
            const container = document.getElementById('rewardListContainer');
            setTimeout(() => container.scrollTop = container.scrollHeight, 50);
        }

        function executeDraw() {
            let totalWeight = rewards.reduce((sum, r) => sum + r.weight, 0);
            if (totalWeight <= 0) return alert("总权重不能为0，请检查奖池配置！");

            let random = Math.random() * totalWeight;
            let current = 0;
            let selected = rewards[0];
            for (let r of rewards) {
                current += r.weight;
                if (random <= current) { selected = r; break; }
            }

            finalRewardTextStr = selected.text;
            
            // 革命性分离：金色彩票底座（永远可见）和 中间刮奖区文字（将被遮盖）
            ticketBgCache = generateTicketBg();
            activeCanvasSource = generateTicketContent(selected.text);
            
            document.getElementById('drawOverlay').classList.add('hidden');
            document.getElementById('drawOverlay').classList.remove('flex');
            isDrawingState = false;
            progress = 0;
            hasWon = false;
            renderCanvas(0);
            startMicLoop();
        }

        // ==========================================
        // 图层生成逻辑：真正实体的刮刮乐
        // ==========================================

        // 1. 生成永远显示的金色底座
        function generateTicketBg() {
            const tCanvas = document.createElement('canvas');
            tCanvas.width = 1200;
            tCanvas.height = 500;
            const ctx = tCanvas.getContext('2d');

            let grad = ctx.createLinearGradient(0, 0, tCanvas.width, tCanvas.height);
            grad.addColorStop(0, '#fef08a');
            grad.addColorStop(0.5, '#f59e0b');
            grad.addColorStop(1, '#b45309');
            
            ctx.fillStyle = grad;
            ctx.beginPath();
            if (ctx.roundRect) ctx.roundRect(20, 20, 1160, 460, 40);
            else ctx.rect(20, 20, 1160, 460);
            ctx.fill();

            ctx.lineWidth = 15;
            ctx.strokeStyle = '#ffffff'; 
            ctx.stroke();

            ctx.beginPath();
            if (ctx.roundRect) ctx.roundRect(50, 50, 1100, 400, 20);
            else ctx.rect(50, 50, 1100, 400);
            ctx.lineWidth = 6;
            ctx.strokeStyle = 'rgba(255,255,255,0.8)';
            ctx.setLineDash([20, 15]);
            ctx.stroke();
            ctx.setLineDash([]); 

            ctx.fillStyle = '#78350f'; 
            ctx.font = '900 45px "Microsoft YaHei", system-ui, sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText("✨ 晨 读 刮 刮 乐 ✨", tCanvas.width / 2, 110);

            // 画出中间的白纸区域，这里永远是白底
            ctx.fillStyle = '#fffbeb'; 
            ctx.beginPath();
            if (ctx.roundRect) ctx.roundRect(100, 180, 1000, 270, 20);
            else ctx.rect(100, 180, 1000, 270);
            ctx.fill();

            return tCanvas;
        }

        // 2. 生成需要被遮盖和马赛克处理的涂层（仅包含白底和红字）
        function generateTicketContent(rewardText) {
            const tCanvas = document.createElement('canvas');
            tCanvas.width = 1200;
            tCanvas.height = 500;
            const ctx = tCanvas.getContext('2d');

            // 【重点】只在中间刮奖区填充白色，这样马赛克引擎只会影响这个区域
            ctx.fillStyle = '#fffbeb';
            ctx.beginPath();
            if (ctx.roundRect) ctx.roundRect(100, 180, 1000, 270, 20);
            else ctx.rect(100, 180, 1000, 270);
            ctx.fill();

            // 巨大的醒目奖励红字
            ctx.fillStyle = '#e11d48'; 
            
            let fontSize = 160;
            if (rewardText.length > 6) fontSize = 130;
            if (rewardText.length > 10) fontSize = 100;
            if (rewardText.length > 15) fontSize = 80;
            ctx.font = `900 ${fontSize}px "Microsoft YaHei", system-ui, sans-serif`;
            
            ctx.shadowColor = "rgba(255,255,255,0.9)";
            ctx.shadowOffsetX = 0;
            ctx.shadowOffsetY = 0;
            ctx.shadowBlur = 15;
            
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(rewardText, tCanvas.width / 2, 315);
            ctx.shadowColor = "transparent";

            return tCanvas;
        }

        function validateDuration() {
            let min = parseInt(document.getElementById('durationMin').value) || 0;
            let sec = parseInt(document.getElementById('durationSec').value) || 0;
            let totalSec = min * 60 + sec;
            const warning = document.getElementById('durationWarning');

            if (totalSec < 20) {
                warning.classList.remove('hidden');
                targetDurationSeconds = 20;
            } else if (totalSec > 1800) {
                warning.classList.remove('hidden');
                document.getElementById('durationMin').value = 30;
                document.getElementById('durationSec').value = 0;
                targetDurationSeconds = 1800;
            } else {
                warning.classList.add('hidden');
                targetDurationSeconds = totalSec;
            }
            
            // 保存时长设置
            localStorage.setItem('scratchDuration', targetDurationSeconds);
            console.log('[存储] 朗读时长已保存:', targetDurationSeconds + '秒');
            
            return targetDurationSeconds;
        }

        function updateThreshold(val) {
            threshold = parseInt(val);
            document.getElementById('thresholdValText').innerText = val + ' dB';
            document.getElementById('thresholdLine').style.bottom = val + '%';
            
            // 保存音量阈值
            localStorage.setItem('scratchThreshold', threshold);
            console.log('[存储] 音量阈值已保存:', threshold + 'dB');
        }

        function toggleSettings(show) {
            const modal = document.getElementById('settingsModal');
            if (show) {
                modal.classList.remove('hidden');
                modal.classList.add('flex');
            } else {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
            }
        }

        async function toggleGame() {
            if (isListening) {
                stopListening();
                return;
            }

            validateDuration();

            if (gameMode === 'image') {
                if (!uploadedImage) return alert("请先上传一张素材图片！");
                activeCanvasSource = uploadedImage;
                ticketBgCache = null; 
                await startMicLoop();
            } else {
                isDrawingState = true;
                updateEmptyState();
                toggleSettings(false); 
                
                const drawOverlay = document.getElementById('drawOverlay');
                drawOverlay.classList.remove('hidden');
                drawOverlay.classList.add('flex');
            }
        }

        async function startMicLoop() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaStream = stream;
                
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioContext.createAnalyser();
                analyser.fftSize = 256;
                analyser.smoothingTimeConstant = 0.5;
                
                const source = audioContext.createMediaStreamSource(stream);
                source.connect(analyser);
                
                isListening = true;
                progress = 0;
                hasWon = false;
                
                toggleSettings(false);
                updateEmptyState();
                
                document.getElementById('topHud').classList.remove('hidden');
                document.getElementById('topHud').classList.add('flex');
                document.getElementById('sideHud').classList.remove('hidden');
                document.getElementById('sideHud').classList.add('flex');
                
                const btn = document.getElementById('mainBtn');
                btn.className = "w-full py-4 rounded-2xl font-black text-2xl flex items-center justify-center gap-3 transition-all shadow-[0_0_20px_rgba(244,63,94,0.4)] bg-gradient-to-r from-rose-500 to-pink-600 hover:from-rose-400 hover:to-pink-500 text-white cursor-pointer transform hover:-translate-y-1 border border-rose-400/50";
                document.getElementById('btnText').innerText = "停止检测";
                document.getElementById('btnIconContainer').innerHTML = `<svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M9 10a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1h-4a1 1 0 01-1-1v-4z"></path></svg>`;

                gameLoop();
            } catch (err) {
                alert("无法访问麦克风，请检查浏览器权限！");
                stopListening();
            }
        }

        function stopListening() {
            isListening = false;
            isDrawingState = false;
            if (mediaStream) mediaStream.getTracks().forEach(track => track.stop());
            if (audioContext) audioContext.close();
            cancelAnimationFrame(animationFrameId);
            
            document.getElementById('topHud').classList.add('hidden');
            document.getElementById('topHud').classList.remove('flex');
            document.getElementById('sideHud').classList.remove('flex');
            document.getElementById('sideHud').classList.add('hidden');
            document.getElementById('drawOverlay').classList.add('hidden');
            document.getElementById('drawOverlay').classList.remove('flex');
            
            const btn = document.getElementById('mainBtn');
            btn.className = "w-full py-4 rounded-2xl font-black text-2xl flex items-center justify-center gap-3 transition-all shadow-[0_0_20px_rgba(6,182,212,0.4)] bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white cursor-pointer transform hover:-translate-y-1 border border-cyan-400/50";
            document.getElementById('btnText').innerText = "开始晨读刮刮乐";
            document.getElementById('btnIconContainer').innerHTML = `<svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132A1 1 0 0014.752 11.168z"></path></svg>`;
            
            updateEmptyState();
        }

        function gameLoop() {
            if (!isListening) return;

            const dataArray = new Uint8Array(analyser.frequencyBinCount);
            analyser.getByteFrequencyData(dataArray);
            
            let sum = 0;
            for (let i = 0; i < dataArray.length; i++) sum += dataArray[i];
            let avg = sum / dataArray.length;
            
            let currentVolume = Math.min(100, Math.max(30, 30 + (avg / 100) * 70));
            
            const vBar = document.getElementById('volumeBar');
            const vText = document.getElementById('volumeText');
            const vIconBg = document.getElementById('volumeIconBg');
            const vIcon = document.getElementById('volumeIcon');
            
            vBar.style.height = currentVolume + '%';
            vText.innerText = Math.floor(currentVolume) + 'dB';
            
            if (currentVolume >= threshold) {
                vBar.classList.replace('bg-rose-500', 'bg-cyan-400');
                vIconBg.classList.replace('bg-rose-500/20', 'bg-cyan-500/20');
                vIconBg.classList.replace('border-rose-500/50', 'border-cyan-500/50');
                vIcon.classList.replace('text-rose-400', 'text-cyan-400');
                vBar.style.boxShadow = '0 0 15px cyan';
            } else {
                vBar.classList.replace('bg-cyan-400', 'bg-rose-500');
                vIconBg.classList.replace('bg-cyan-500/20', 'bg-rose-500/20');
                vIconBg.classList.replace('border-cyan-500/50', 'border-rose-500/50');
                vIcon.classList.replace('text-cyan-400', 'text-rose-400');
                vBar.style.boxShadow = 'none';
            }

            if (!hasWon) {
                const framesNeeded = targetDurationSeconds * 60;
                const progressPerFrame = 100 / framesNeeded;

                if (currentVolume >= threshold) progress = Math.min(100, progress + progressPerFrame);
                else progress = Math.max(0, progress - (progressPerFrame * 0.25));

                const pBar = document.getElementById('progressBar');
                const pText = document.getElementById('progressText');
                pBar.style.width = progress + '%';
                if (progress > 5) {
                    pText.classList.remove('hidden');
                    pText.innerText = Math.floor(progress) + '%';
                } else {
                    pText.classList.add('hidden');
                }

                if (progress >= 100) {
                    hasWon = true; 
                    renderCanvas(100); 
                    
                    // 【关键修复】定格画面让全班看清彩票文字，3秒后才出现半透明撒花弹窗
                    setTimeout(() => {
                        winGame();
                    }, 3000); 
                }
            }
            
            // 每一帧强制渲染画布，防止画布消失
            renderCanvas(progress);

            animationFrameId = requestAnimationFrame(gameLoop);
        }

        // ==========================================
        // 核心渲染引擎 (修复了之前的图层覆盖Bug)
        // ==========================================
        function renderCanvas(currentProg) {
            if (!activeCanvasSource) return;
            const ctx = canvas.getContext('2d');
            const width = canvas.width;
            const height = canvas.height;

            ctx.clearRect(0, 0, width, height);

            const scale = Math.min((width * 0.8) / activeCanvasSource.width, (height * 0.8) / activeCanvasSource.height);
            const drawW = activeCanvasSource.width * scale;
            const drawH = activeCanvasSource.height * scale;
            const drawX = (width - drawW) / 2;
            const drawY = (height - drawH) / 2;

            // 1. 如果有金色背景，永远先画在最底下
            if (ticketBgCache) {
                ctx.drawImage(ticketBgCache, drawX, drawY, drawW, drawH);
            }

            // 2. 准备渲染目标层（图片 或 包含文字的刮奖区）
            const targetCanvas = document.createElement('canvas');
            targetCanvas.width = width;
            targetCanvas.height = height;
            const tCtx = targetCanvas.getContext('2d');

            tCtx.drawImage(activeCanvasSource, drawX, drawY, drawW, drawH);
            
            // 让后续的遮罩和变色效果，严格被限制在目标层的像素范围内
            tCtx.globalCompositeOperation = 'source-in';

            if (currentProg < 70) {
                // 阶段一：纯色遮罩盖住文字
                let baseColor = gameMode === 'ticket' ? 180 : 10; // 刮刮乐用亮银灰色涂层，图片用暗黑
                let lightness = baseColor + Math.floor((currentProg / 70) * 40); 
                tCtx.fillStyle = `rgb(${lightness}, ${lightness-2}, ${lightness+5})`;
                tCtx.fillRect(0, 0, width, height);
            } else {
                // 阶段二：马赛克+透明褪去（90%隐约可见，100%完全清晰）
                let stage2Prog = (currentProg - 70) / 30; 
                let blockSize = Math.max(1, Math.floor(40 - stage2Prog * 39)); 
                
                const mosaicCanvas = document.createElement('canvas');
                mosaicCanvas.width = drawW;
                mosaicCanvas.height = drawH;
                const mCtx = mosaicCanvas.getContext('2d');
                mCtx.imageSmoothingEnabled = false;

                if (blockSize > 1) {
                    mCtx.drawImage(activeCanvasSource, 0, 0, drawW / blockSize, drawH / blockSize);
                    mCtx.drawImage(mosaicCanvas, 0, 0, drawW / blockSize, drawH / blockSize, 0, 0, drawW, drawH);
                } else {
                    mCtx.imageSmoothingEnabled = true;
                    mCtx.drawImage(activeCanvasSource, 0, 0, drawW, drawH);
                }

                // 将马赛克画回目标层
                tCtx.drawImage(mosaicCanvas, drawX, drawY);

                // 【修复核心】切换合成模式，让遮罩层褪去只影响已有像素，不再覆盖黑色矩形！
                tCtx.globalCompositeOperation = 'source-atop';
                let overlayAlpha = 0.8 * (1 - stage2Prog);
                
                // 在马赛克上叠加一层颜色，这层颜色会随着进度变透明，在90%时非常淡，100%消失
                tCtx.fillStyle = gameMode === 'ticket' ? `rgba(220, 220, 220, ${overlayAlpha})` : `rgba(10, 5, 20, ${overlayAlpha})`;
                tCtx.fillRect(0, 0, width, height);
            }

            // 3. 将特效处理好的层，叠盖回主画布上！
            ctx.drawImage(targetCanvas, 0, 0);
        }

        function winGame() {
            stopListening();
            const successOverlay = document.getElementById('successOverlay');
            successOverlay.classList.remove('hidden');
            successOverlay.classList.add('flex');
            
            const rewardLabel = document.getElementById('finalRewardLabel');
            const rewardText = document.getElementById('finalRewardText');
            
            if (gameMode === 'ticket') {
                rewardLabel.classList.remove('hidden');
            } else {
                rewardLabel.classList.add('hidden');
            }
            
            rewardText.innerText = finalRewardTextStr;
        }

        function resetGame() {
            document.getElementById('successOverlay').classList.add('hidden');
            document.getElementById('successOverlay').classList.remove('flex');
            progress = 0;
            hasWon = false;
            document.getElementById('progressBar').style.width = '0%';
            document.getElementById('progressText').classList.add('hidden');
            
            if (gameMode === 'ticket') {
                activeCanvasSource = null;
                ticketBgCache = null;
                updateEmptyState();
                renderCanvas(0);
                toggleSettings(true); 
            } else {
                renderCanvas(0);
            }
        }

        // ==========================================
        // 全屏功能
        // ==========================================
        function toggleFullscreen() {
            const enterPath = document.getElementById('enterFullscreenPath');
            const exitPath = document.getElementById('exitFullscreenPath');
            
            if (!document.fullscreenElement && !document.webkitFullscreenElement && !document.mozFullScreenElement) {
                // 进入全屏
                const elem = document.documentElement;
                if (elem.requestFullscreen) {
                    elem.requestFullscreen();
                } else if (elem.webkitRequestFullscreen) { // Safari
                    elem.webkitRequestFullscreen();
                } else if (elem.mozRequestFullScreen) { // Firefox
                    elem.mozRequestFullScreen();
                } else if (elem.msRequestFullscreen) { // IE/Edge
                    elem.msRequestFullscreen();
                }
                
                // 切换图标
                enterPath.classList.add('hidden');
                exitPath.classList.remove('hidden');
            } else {
                // 退出全屏
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) { // Safari
                    document.webkitExitFullscreen();
                } else if (document.mozCancelFullScreen) { // Firefox
                    document.mozCancelFullScreen();
                } else if (document.msExitFullscreen) { // IE/Edge
                    document.msExitFullscreen();
                }
                
                // 切换图标
                enterPath.classList.remove('hidden');
                exitPath.classList.add('hidden');
            }
        }

        // 监听全屏状态变化（用户按ESC退出全屏时更新图标）
        document.addEventListener('fullscreenchange', updateFullscreenIcon);
        document.addEventListener('webkitfullscreenchange', updateFullscreenIcon);
        document.addEventListener('mozfullscreenchange', updateFullscreenIcon);
        document.addEventListener('MSFullscreenChange', updateFullscreenIcon);

        function updateFullscreenIcon() {
            const enterPath = document.getElementById('enterFullscreenPath');
            const exitPath = document.getElementById('exitFullscreenPath');
            
            if (document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement) {
                // 当前是全屏状态
                enterPath.classList.add('hidden');
                exitPath.classList.remove('hidden');
            } else {
                // 当前不是全屏状态
                enterPath.classList.remove('hidden');
                exitPath.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
